[package]
name = "ore-phone"
version = "0.1.0"
description = "Ore for iPhone"
edition = "2021"

# Tauri's mobile targets load the app as a library.
[lib]
name = "ore_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# The phone's fetch of other sites (a web view can't: CORS and the CSP). MIT/Apache, rustls.
ureq = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# The ticks under a finger (D332). Apache-2.0 OR MIT.
tauri-plugin-haptics = "2"
