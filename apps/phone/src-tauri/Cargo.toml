[package]
name = "ore-phone"
version = "0.1.0"
description = "Ore for iPhone"
edition = "2021"

# Tauri's mobile targets load the app as a library.
[lib]
name = "ore_phone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
