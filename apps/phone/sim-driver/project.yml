# XcodeGen spec for the Simulator driver: a UI test that takes commands from a folder and plays
# them on the installed Ore app as real touches (XCUITest), so an agent can use the phone app like a
# person. Test tooling only; nothing here ships in the app. Run it with `bun apps/phone/scripts/sim.ts`.
name: OreSimDriver
options:
  bundleIdPrefix: com.tylerpoelking.oresimdriver
  deploymentTarget:
    iOS: 17.0
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tylerpoelking.oresimdriver.host
        CODE_SIGNING_ALLOWED: NO
  DriverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [DriverUITests]
    dependencies:
      - target: Host
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Host
        CODE_SIGNING_ALLOWED: NO
schemes:
  Driver:
    build:
      targets:
        Host: all
        DriverUITests: [test]
    test:
      targets: [DriverUITests]
