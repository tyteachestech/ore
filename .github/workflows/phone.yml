# Compiles the iPhone app (apps/phone: the Rust shell, its Swift, the share extension) for the Simulator, so phone
# code that won't build is caught before merge. A compile check only: no signing, no device, no tests. macOS
# runners cost more, so it runs only when the phone's own code changes; the phone's web bundle is test.yml's job.
name: phone
on:
  pull_request:
    paths: [apps/phone/**, .github/workflows/phone.yml]
  push:
    branches: [master]
    paths: [apps/phone/**, .github/workflows/phone.yml]
concurrency:
  group: phone-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    # Hear.swift uses SpeechAnalyzer: the iOS 26 SDK, so Xcode 26 or later.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: xcodebuild -version && rustup target add aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/phone/src-tauri
      - run: command -v xcodegen || brew install xcodegen
      # The Xcode project is generated (gen/ is not in git), as on the Mac: ios:init writes it and adds the Swift.
      - working-directory: apps/phone
        run: bun run ios:init
      - working-directory: apps/phone
        run: bun run tauri ios build --debug --target aarch64-sim
