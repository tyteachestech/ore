# Every PR and every push to master: typecheck, all tests, the desktop build, the end-to-end journeys, and the
# speed benchmark against its baseline (a step 1.5× slower fails).
name: test
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/desktop build
      - run: bun apps/desktop/scripts/mock/impeccable-gate.ts
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/ore-e2e-*.png
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # The compiled CLI, as the installed app runs it (D30); the baseline was recorded on this runner type.
      - run: bun run bench --compiled --check apps/desktop/scripts/bench-baseline.json
