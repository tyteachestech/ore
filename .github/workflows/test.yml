# Every PR and every push to master: typecheck, all tests, the desktop build, and the end-to-end journeys.
# The speed benchmark is bench.yml.
name: test
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: test-${{ github.ref }}
  # A PR's stale run is cancelled by the next push; a master run always completes, so a red master never hides behind "cancelled" (docs/WORKFLOW.md).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run --cwd apps/desktop build
      # The iPhone bundle has its own Vite setup (D78): a core import only Bun understands breaks it and nothing else.
      - run: mkdir -p /tmp/empty-library && cd apps/desktop && ORE_PHONE=1 ORE_PHONE_LIBRARY=/tmp/empty-library bunx vite build
      - run: bun apps/desktop/scripts/mock/impeccable-gate.ts
  # The journeys in four runners side by side, each a quarter of them in order on its own fresh library: one runner
  # took 14 min. A shard that fails leaves the others running, so one run shows every failing journey.
  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # WebKit is for the journeys about what only the Mac app's engine does (its native undo in a text field).
      # From the cache when it has them, so a run doesn't wait on Ubuntu's mirrors (.github/actions/playwright).
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium webkit
      - run: bun run e2e
        env:
          ORE_E2E_SHARD: ${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: /tmp/ore-e2e-*.png
