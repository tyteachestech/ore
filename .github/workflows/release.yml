# A downloadable Ore for Apple Silicon Macs. Push a tag (git tag v0.1.0 && git push origin v0.1.0) to
# build it and attach Ore.dmg to a GitHub Release; "Run workflow" builds one to try, without a release.
# With the Apple secrets (README › Releasing) the app is signed and notarized; without them it is
# signed ad hoc, and macOS asks once to open it anyway.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # A PR that changes how the release is built builds one too, so a broken release shows before the tag.
  pull_request:
    paths: [.github/workflows/release.yml, apps/desktop/src-tauri/**, apps/desktop/scripts/bundle-cli.ts]
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Signing, if the Apple secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<EOV"; printenv "$v"; echo "EOV"; } >> "$GITHUB_ENV"
            done
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - run: bun run tauri build --config src-tauri/tauri.release.json
        working-directory: apps/desktop
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: The bundled CLI starts and reads a library
        run: |
          cli=$(ls apps/desktop/src-tauri/binaries/ore-cli-*)
          export ORE_LIBRARY="$RUNNER_TEMP/lib"
          "$cli" init "$ORE_LIBRARY" --json > /dev/null
          "$cli" skills add Piano --json > /dev/null
          "$cli" add --stdin --no-enrich --json <<< "# Notes on recall

          Retrieval beats rereading." > /dev/null
          "$cli" ls --json | grep -q "Notes on recall"
          "$cli" search recall --json | grep -q "Notes on recall"
      - name: Ore.dmg
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          cp target/release/bundle/dmg/*.dmg "Ore-$version.dmg"
          echo "DMG=Ore-$version.dmg" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ore-dmg
          path: ${{ env.DMG }}
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG" --title "Ore $GITHUB_REF_NAME" --generate-notes
